# Nous v2 campaign: llm-d precise-path prefix-cache BLOCK-SIZE SWEEP.
# One knob: --block-size-in-tokens in {8, 16, 32, 64}, control = the shipped default 16 (B-ship),
# everything else held at shipped config, measured in the BLIS simulator.
#
# Study: /Users/kelly/git/ains-loop/studies/blocksize-sweep/ — question.md holds the
# pre-registered question, falsifier and apparatus pins; grounding.md holds where the lever
# lives in llm-d-router. Authored 2026-11-05.
#
# The apparatus (pinned BLIS binary, catalog, traces, and the locked scripts/blocksize/ tree)
# lives at /Users/kelly/git/nous-run/nous-campaigns/blis-pd-decider-threshold and is referenced
# by absolute path only; it is NEVER modified by this campaign.
#
# locked_parameters.apparatus_manifest_sha256 is the sha256 of ROOT/scripts/blocksize/
# MANIFEST.sha256 (filled 2026-11-05 after the manifest was generated and verified).

research_question: >
  Does llm-d's shipped precise-path prefix-cache block size of 16 tokens still hold across the
  A1 workload set (W1-W4, C0, W5t, W5w, W6 on layouts 2P/6D, 3P/5D, 4P/4D at 25 GB/s, seeds 1-3,
  BLIS simulator), or does some alternative in {8, 32, 64} improve the gated capacity-or-hit-rate
  headline metric by 5% or more over B-ship (16) on at least one workload while staying inside
  the TTFT/TPOT stage gates? The pre-registered verdict metric is blocksize_max_gated_gain_pct:
  16 stands iff it is below 5.0.

run_id: llmd-blocksize-sweep

# Verification/measurement campaign: a pre-registered claim ("16 is the right default") checked
# by a locked sweep and a locked analysis. baseline.schema.json for `verify` wants
# observation.points = [{condition, predicted, measured}] — the BASELINE section below says
# exactly what to record (the rehearsal's b16-referenced verdict value).
task_type: verify

max_iterations: 2
# stall_iterations left at the default (2): with max_iterations 2 the max-iterations stop fires
# first, and iteration 2 is expected to answer the question outright.

target_system:
  name: BLIS (inference-sim) llm-d prefix-cache block-size sweep
  # The investigation repo. Nous v2 works in a worktree of this repo
  # (<repo>/.nous-experiments/llmd-blocksize-sweep, branch nous/llmd-blocksize-sweep); the
  # BLIS apparatus is NOT this repo and is only ever referenced by absolute path.
  repo_path: /Users/kelly/git/ains-loop
  description: |
    ## What this campaign is

    A pre-registered measurement sweep of ONE knob in the BLIS simulator: the precise-path
    prefix-cache block size, `--block-size-in-tokens`, over {8, 16, 32, 64}. Block size 16 is
    B-ship (the shipped llm-d default) and the control arm in every comparison. Everything else
    is held at shipped config: the P/D decider stays the prefix-threshold decider at T=16
    (NOT swept here — that was campaign llmd-a1-pd-threshold), `--hash-chain-block-tokens`
    stays at the trace-appropriate value (64 for the Weka trace, 512 for every other trace),
    and all model/hardware/layout/bandwidth settings stay as the A1 apparatus ships them.

    **This campaign runs a fixed, pre-registered driver and a locked analysis. It does not
    evolve code and it changes NO code anywhere.**
    - NEVER modify the BLIS apparatus at
      `/Users/kelly/git/nous-run/nous-campaigns/blis-pd-decider-threshold` (called ROOT below):
      not the pinned binary `bin/blis-9addaae2`
      (sha256 43dbef622ece2aef6034bad9f701352db4451a81326db2564361add449d5eb4d), not the
      catalog (git repo, deliberately pinned at commit
      6fe4664576bc43d601bba6619aca4fbb42c5087b — never `git pull` it), not the traces, not the
      scripts. ROOT is referenced by absolute path only.
    - NEVER modify `/Users/kelly/git/ains-loop` itself either: Nous gave you a working copy (a
      git worktree of it) and that is the only repo you work in. Your writable surface is your
      Nous artifact files (`baseline.json`, `runs/iter-N/*.json`, `answer.json`, `report.md`)
      and the results directories the driver creates under your work dir. Nothing else.
    - Never hand-tune: no arm, seed, workload, layout, threshold, target or rule may change
      after seeing results. No BLIS runs beyond what `driver.py` schedules. Ideas for follow-ups
      go in the findings text, not into extra runs.
    - Report failures plainly, with their output. A failing stage gate or an odd curve is a
      result, not a bug to fix. Never re-run a BLIS job to "fix" it; report the anomaly.
    - You never invent a number. Every number you report comes from a file the driver or the
      locked analysis wrote, and your evidence citations must point at those files so a
      validator can re-read them (see "Findings and evidence" below).

    ## Where things run

    - ROOT (apparatus, read-only): `/Users/kelly/git/nous-run/nous-campaigns/blis-pd-decider-threshold`
    - Your work dir: the `NOUS_WORK_DIR` environment variable (`echo "$NOUS_WORK_DIR"`). Written
      `$WORK` below. Every result path below is under `$WORK`. When in doubt, trust
      `$NOUS_WORK_DIR`, not an assumed location.
    - Your working copy (cwd): the Nous worktree of `/Users/kelly/git/ains-loop`. The driver and
      analysis are invoked by absolute ROOT path, so cwd barely matters, but artifact files go
      under `$WORK`, not the repo.
    - Source the apparatus environment before any driver/analysis call:
      `source ROOT/env.sh` (sets PATH and BLIS_CATALOG).

    ## The locked scripts (hash-locked by ROOT/scripts/blocksize/MANIFEST.sha256)

    - `ROOT/scripts/blocksize/blocksize.py` — definitions: the run matrix, arms, workloads,
      layouts, flags. Authoritative for what runs; do not re-derive it.
    - `ROOT/scripts/blocksize/driver.py DIR {rehearsal|full}` — the scheduler. Detached and
      idempotent; writes `jobs.json` (the run matrix), `progress.json`, `det.json`
