      sha256 itself and refuses to double-drive one directory. It passes
      `--block-size-in-tokens` explicitly on every run so the arm is always pinned.
    - `ROOT/scripts/blocksize/analysis.py DIR` — the locked, pre-registered analysis. Writes
      `DIR/analysis/objective_metadata.json` (the verdict), `DIR/analysis/summary.json`
      (everything) and `DIR/analysis/tables.md` (human-readable per-workload curves).
    - `ROOT/scripts/blocksize/wait.sh DIR` — polls the driver.

    ## Iteration plan (fixed: BASELINE + 2 iterations)

    **BASELINE — the B-ship rehearsal measurement.** Run the rehearsal sweep (cheap subset,
    seed 42) into a baseline dir and record its b16-referenced verdict:

    ```
    source ROOT/env.sh
    mkdir -p "$WORK/baseline/results"
    nohup python3 ROOT/scripts/blocksize/driver.py "$WORK/baseline/results/blocksize" rehearsal > "$WORK/baseline/results/blocksize.driver.log" 2>&1 &
    ROOT/scripts/blocksize/wait.sh "$WORK/baseline/results/blocksize"     # repeat until exit 0
    python3 ROOT/scripts/blocksize/analysis.py "$WORK/baseline/results/blocksize"
    ```

    Then write `baseline.json` (task_type `verify`):
    - `command`: the driver+wait+analysis chain above as one line.
    - `git_sha`: `git rev-parse HEAD` in your working copy.
    - `observation.points`: one point —
      `condition`: "B-ship --block-size-in-tokens 16, rehearsal subset, seed 42, all else shipped config",
      `predicted`: "blocksize_max_gated_gain_pct < 5.0 (the shipped 16 stands: no alternative in {8,32,64} gains >= 5% within the latency gates)",
      `measured`: the `blocksize_max_gated_gain_pct` value copied exactly from
      `$WORK/baseline/results/blocksize/analysis/objective_metadata.json`.
    - `metrics_path`: `baseline/results/blocksize/analysis/objective_metadata.json`.
    - `noise`: `{deterministic: true}` iff `det.json` shows the determinism sample passed
      (repeats identical); if it did not, report the anomaly and record
      `{unmeasured: true, reason: ...}` instead — do not fix anything.

    Before the baseline run, verify the apparatus (read-only):
    `(cd ROOT && shasum -a 256 -c scripts/blocksize/MANIFEST.sha256)` — every line OK;
    `git -C ROOT/blis-catalog rev-parse HEAD` — 6fe4664576bc43d601bba6619aca4fbb42c5087b.

    **ITERATION 1 — REHEARSAL.** Same driver, mode `rehearsal` (seed 42, cheap subset,
    determinism sample), results dir for iteration N being `$WORK/runs/iter-N/results/`:

    ```
    source ROOT/env.sh
    mkdir -p "$WORK/runs/iter-1/results"
    nohup python3 ROOT/scripts/blocksize/driver.py "$WORK/runs/iter-1/results/blocksize" rehearsal > "$WORK/runs/iter-1/results/blocksize.driver.log" 2>&1 &
    ROOT/scripts/blocksize/wait.sh "$WORK/runs/iter-1/results/blocksize"     # repeat until exit 0
    python3 ROOT/scripts/blocksize/analysis.py "$WORK/runs/iter-1/results/blocksize"
    ```

    - Poll `wait.sh` until exit 0; read `$WORK/runs/iter-1/results/blocksize/progress.json` for
      progress. Each `wait.sh` call is bounded (~8 min in the A1 apparatus — use a Bash tool
      timeout of 600000 ms and call again while it returns non-zero). Never `sleep` more than
      480 s in one call.
    - If the driver died (no driver process left and `progress.json` frozen), re-launch the
