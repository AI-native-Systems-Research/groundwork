# Starter PromQL list for capture_prom.py: a flat {name: promql} mapping.
# Merged with the repo config's `promql_extra` and any --extra-queries file
# (later sources win on a name clash).
#
# Metric-name check (2026-11-05), done with `git grep` / `git show` at fixed shas,
# nothing checked out:
#   vLLM        ~/git/vllm @ 2f1cba799e, vllm/v1/metrics/loggers.py
#   llm-d-router ~/git/llm-d-router @ 618eb0a9, pkg/epp/metrics/llm_d_router_metrics.go,
#               pkg/epp/framework/plugins/scheduling/profilehandler/disagg/metrics.go
#
# What was checked, and what changed from the design-v2 list:
#   - Every base name exists at those shas. Every `_bucket` query's base is a
#     Histogram (vLLM: self._histogram_cls = prometheus_client.Histogram;
#     llm-d: prometheus.NewHistogramVec), so `_bucket` is exposed implicitly.
#   - CHANGED: vLLM counters are prometheus_client.Counter, which appends `_total`
#     on exposition. The source names vllm:num_preemptions, vllm:prefix_cache_hits,
#     vllm:prefix_cache_queries, vllm:external_prefix_cache_hits and
#     vllm:external_prefix_cache_queries are therefore scraped as `<name>_total`.
#     The design's list used the bare names, which would come back empty.
#     vllm:prompt_tokens / vllm:generation_tokens were already written with _total.
#   - llm-d counters are declared with `_total` in Name (request_total,
#     request_error_total, scheduler_attempts_total, disagg_decision_total);
#     client_golang does not append it, so those names are as-is.
#   - Labels: `plugin_type` on llm_d_epp_plugin_duration_seconds (labels
#     extension_point, plugin_type, plugin_name) and `status` on
#     llm_d_epp_scheduler_attempts_total are correct.
#     CHANGED: llm_d_epp_disagg_decision_total has no `decision` label; its labels
#     are plugin_name, plugin_type, model_name, decision_type. Now `by (decision_type)`.
#   - llm_d_epp_per_endpoint_queue_size is a custom-collector Desc (labels name,
#     model_server_endpoint), registered by NewInferencePoolMetricsCollector. Kept.
#   - `pod` is not a label vLLM sets (it sets model_name, engine); it comes from
#     Prometheus' Kubernetes scrape relabeling. If a cluster's relabeling differs,
#     the `by (pod)` queries still return data, just under one empty-pod series.
#   - external_prefix_cache_* are registered unconditionally but stay at zero
#     without a KV connector; the ratio is then NaN, which summaries drop.
#   Nothing was dropped.

# vLLM: load and queueing
vllm_running: sum by (pod) (vllm:num_requests_running)
vllm_waiting: sum by (pod) (vllm:num_requests_waiting)
vllm_preemptions_rate: sum by (pod) (rate(vllm:num_preemptions_total[5m]))

# vLLM: KV cache and prefix reuse
vllm_kv_usage: avg by (pod) (vllm:kv_cache_usage_perc)
vllm_prefix_hit_ratio: sum by (pod) (rate(vllm:prefix_cache_hits_total[5m])) / sum by (pod) (rate(vllm:prefix_cache_queries_total[5m]))
vllm_ext_prefix_hit_ratio: sum (rate(vllm:external_prefix_cache_hits_total[5m])) / sum (rate(vllm:external_prefix_cache_queries_total[5m]))

# vLLM: latency (p50/p99 from histograms)
vllm_ttft_p50: histogram_quantile(0.5, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
vllm_ttft_p99: histogram_quantile(0.99, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
vllm_itl_p50: histogram_quantile(0.5, sum by (le) (rate(vllm:inter_token_latency_seconds_bucket[5m])))
vllm_itl_p99: histogram_quantile(0.99, sum by (le) (rate(vllm:inter_token_latency_seconds_bucket[5m])))
vllm_queue_p99: histogram_quantile(0.99, sum by (le) (rate(vllm:request_queue_time_seconds_bucket[5m])))
vllm_e2e_p99: histogram_quantile(0.99, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket[5m])))

# vLLM: throughput and shape
vllm_prompt_tps: sum (rate(vllm:prompt_tokens_total[5m]))
vllm_gen_tps: sum (rate(vllm:generation_tokens_total[5m]))
vllm_prompt_len_p50: histogram_quantile(0.5, sum by (le) (rate(vllm:request_prompt_tokens_bucket[5m])))
vllm_gen_len_p50: histogram_quantile(0.5, sum by (le) (rate(vllm:request_generation_tokens_bucket[5m])))

# llm-d EPP: routing and scheduling
epp_request_rate: sum (rate(llm_d_epp_request_total[5m]))
epp_error_rate: sum (rate(llm_d_epp_request_error_total[5m]))
epp_e2e_p99: histogram_quantile(0.99, sum by (le) (rate(llm_d_epp_request_duration_seconds_bucket[5m])))
epp_ntpot_p99: histogram_quantile(0.99, sum by (le) (rate(llm_d_epp_request_ntpot_seconds_bucket[5m])))
epp_plugin_p99: histogram_quantile(0.99, sum by (le, plugin_type) (rate(llm_d_epp_plugin_duration_seconds_bucket[5m])))
epp_sched_attempts: sum by (status) (rate(llm_d_epp_scheduler_attempts_total[5m]))
epp_cached_tokens_p50: histogram_quantile(0.5, sum by (le) (rate(llm_d_epp_request_cached_tokens_bucket[5m])))
epp_kv_util_avg: llm_d_epp_average_kv_cache_utilization
epp_kv_util_stddev: llm_d_epp_std_dev_kv_cache_utilization
epp_queue_per_endpoint: llm_d_epp_per_endpoint_queue_size
epp_disagg_decisions: sum by (decision_type) (rate(llm_d_epp_disagg_decision_total[5m]))
epp_flow_queue: sum (llm_d_epp_flow_control_queue_size)
